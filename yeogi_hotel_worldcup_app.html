      .compare-wrap{grid-template-columns:1fr;gap:0;max-width:530px;margin:0 auto}.hotel{border-radius:16px}.photo{height:195px}.hotel-body{padding:17px 17px 19px}
      .hotel-title{display:flex}.hotel-title h3{font-size:20px;min-height:0}.rating{margin-top:0}.summary{font-size:11px;min-height:0}
      .hotel-row{display:flex;font-size:11px;padding:9px 0}.row-key,.row-val{display:block}.row-val{text-align:right}.price{font-size:25px}.cost-line{display:flex}.cost-help{font-size:10px}.choose{font-size:13px}
      .vs{position:relative;left:auto;top:auto;transform:none;margin:-5px auto;z-index:4;border-color:#faf9fb;width:51px;height:51px;font-size:15px;box-shadow:0 3px 13px #9e627a14}
      .reviews{padding:10px 12px}.reviews-head{display:flex}.review{display:flex}.review p{font-size:11px}.result-info{padding:19px}.result-head h2{font-size:23px}.result-footer{flex-wrap:wrap}.result-footer .choose{width:100%;min-width:0}
    }
    @media(max-width:420px){
      .brand-small,.brand-sep,.hero-art{display:none}.topbar-inner{gap:7px}.top-reset{padding:4px}.brand{gap:7px}
      .hero{min-height:0;padding:21px 17px}.hero h1{font-size:23px}.hero p{font-size:11px}.stage-panel{padding:14px 11px}.stage-name{margin-bottom:10px}.step-top{font-size:9px}.match-intro h2{font-size:19px}
      .hotel-body{padding:16px}.photo{height:178px}.hotel-title h3{font-size:19px}.summary{font-size:11px}.rating-count{font-size:9px}
      .hotel-row{font-size:11px}.row-val{text-align:right}.hotel .reviews{padding:10px 11px}.hotel .reviews-head strong{font-size:11px}.hotel .reviews-head span{font-size:9px}
      .hotel .review{display:flex}.hotel .review-score{font-size:10px}.hotel .review-author{font-size:10px;margin-left:0}.hotel .review p{font-size:10px}
      .cost-line{display:flex}.price{font-size:23px}.choose{font-size:12px}.result-footer .choose{width:100%}.coupon-banner strong{font-size:12px}.result-image{height:205px}
    }
  </style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#" id="homeLink" aria-label="숙소 월드컵 처음으로">
      <span class="brand-mark">여</span><span class="brand-name">여기어때</span><span class="brand-sep"></span><span class="brand-small">HOTEL WORLD CUP</span>
    </a>
    <div class="top-actions"><span class="demo-chip">앱 내 서비스 · DEMO</span><button class="top-reset" id="resetTop" type="button">처음부터 ↻</button></div>
  </div>
</header>
<main class="shell">
  <section class="hero" aria-label="서비스 소개">
    <div style="position:relative;z-index:2">
      <div class="eyebrow"><span class="eyebrow-line"></span> 여기어때 숙소 월드컵</div>
      <h1>내 마음에 쏙 드는 숙소,<br><span>월드컵으로 골라봐!</span></h1>
      <p>가격·위치·후기·취소 조건까지 꼼꼼하게 비교!<br>지금 선택하면 시크릿 쿠폰까지 기다리고 있어요.</p>
    </div>
    <div class="hero-art" aria-hidden="true"><div class="hero-card">🏨</div><div class="hero-card">🎟️</div><div class="hero-star">✦</div></div>
  </section>
  <div class="stage-panel" aria-label="진행 상황">
    <div class="stage-name">나의 숙소 월드컵<strong id="stageTitle">4강 · 첫 번째 대결</strong></div>
    <div class="stage-steps" id="stageSteps"></div>
  </div>
  <section id="game" aria-live="polite"></section>
  <div class="help"><span class="help-icon">i</span><span>QMS 발표용 콘셉트 시연입니다. 숙소·가격·평점·후기·쿠폰은 가상의 예시이며 실제 예약이나 결제는 발생하지 않습니다.</span></div>
  <div class="footer">QMS 마케팅 프로젝트 · 여기어때 숙소 월드컵 CONCEPT PROTOTYPE · 비공식 시연용</div>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
  'use strict';
  // 후기는 시연용 예시이며 실제 숙소 리뷰가 아닙니다.
  const sampleReviews = {
    1:[{score:5,author:'여행객 A',text:'역이 가까워 이동하기 편했고, 조식도 만족스러웠어요.'},{score:3,author:'여행객 B',text:'객실은 깔끔했지만 밤에는 복도 소음이 조금 들렸어요.'}],
    2:[{score:5,author:'여행객 C',text:'쇼핑하기 좋은 위치에 객실 컨디션도 기대 이상이었어요.'},{score:3,author:'여행객 D',text:'위치는 좋았지만 조식이 없고 객실이 조금 좁았어요.'}],
    3:[{score:5,author:'여행객 E',text:'가격에 비해 객실과 조식이 좋아서 만족했어요.'},{score:3,author:'여행객 F',text:'가성비는 좋지만 역까지 조금 걸어야 했어요.'}],
    4:[{score:5,author:'여행객 G',text:'창밖 풍경이 멋지고 숙소 분위기도 좋았어요.'},{score:3,author:'여행객 H',text:'뷰는 좋지만 주변 식당 선택지가 조금 적었어요.'}]
  };
  const couponAmount = 10000; // 가상의 시연용 시크릿 쿠폰
  const hotels = [
    {id:1,name:'시부야 라이트 호텔',area:'도쿄 · 시부야',loc:'시부야역 도보 5분',price:138000,rating:'4.8',review:'후기 1,284개',cancel:'체크인 3일 전 무료',breakfast:'조식 포함',room:'디럭스 더블 · 2인',tag:'역세권 추천',desc:'이동 시간을 줄이고 도쿄 곳곳을 여유롭게 둘러보고 싶다면',photo:'https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1100&q=85',bg:'linear-gradient(135deg,#c4d3d0,#889eac)'},
    {id:2,name:'긴자 모먼트 스테이',area:'도쿄 · 긴자',loc:'긴자역 도보 3분',price:159000,rating:'4.9',review:'후기 942개',cancel:'체크인 1일 전 무료',breakfast:'조식 불포함',room:'슈페리어 더블 · 2인',tag:'평점 높은 숙소',desc:'쇼핑과 미식을 가까이에서 즐기고 깔끔한 객실을 선호한다면',photo:'https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?auto=format&fit=crop&w=1100&q=85',bg:'linear-gradient(135deg,#cdbdaa,#948775)'},
    {id:3,name:'우에노 브리즈 호텔',area:'도쿄 · 우에노',loc:'우에노역 도보 7분',price:109000,rating:'4.6',review:'후기 2,013개',cancel:'체크인 5일 전 무료',breakfast:'조식 포함',room:'스탠다드 트윈 · 2인',tag:'가성비 추천',desc:'합리적인 가격과 든든한 조식으로 여행을 시작하고 싶다면',photo:'https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=1100&q=85',bg:'linear-gradient(135deg,#b0bac7,#7d9e93)'},
    {id:4,name:'아사쿠사 리버뷰',area:'도쿄 · 아사쿠사',loc:'아사쿠사역 도보 6분',price:126000,rating:'4.7',review:'후기 1,576개',cancel:'체크인 2일 전 무료',breakfast:'조식 불포함',room:'리버뷰 더블 · 2인',tag:'뷰 맛집',desc:'여행지의 분위기를 느끼며 창밖 풍경까지 특별하게 즐기고 싶다면',photo:'https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?auto=format&fit=crop&w=1100&q=85',bg:'linear-gradient(135deg,#abc9d1,#91a6bd)'}
  ];
  let seeds = hotels.slice(), winners = [], match = 0, history = [];
  const $ = id => document.getElementById(id);
  const money = n => new Intl.NumberFormat('ko-KR').format(n);
  const esc = s => String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
  const iconArrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 14 0m-6-6 6 6-6 6"/></svg>';
  const stepNames = ['4강 ①','4강 ②','결승','최종 선택','쿠폰 예약'];
  function renderStage(){
    const titles = ['4강 · 첫 번째 대결','4강 · 두 번째 대결','결승 · 마지막 대결','최종 숙소 선택 완료','시크릿 쿠폰 적용 · 예약'];
    $('stageTitle').textContent=titles[match];
    $('stageSteps').innerHTML=stepNames.map((s,i)=>`<div class="step ${i<match?'done':i===match?'active':''}"><div class="step-top">${s}</div><div class="step-bar"></div></div>`).join('');
  }
  function renderReviews(h){
    return `<div class="reviews"><div class="reviews-head"><strong>이용 후기 미리보기</strong><span>${esc(h.review)} · 예시 후기</span></div>${sampleReviews[h.id].map(r=>`<div class="review"><span class="review-score">★ ${r.score}.0</span><div><span class="review-author">${esc(r.author)}</span><p>${esc(r.text)}</p></div></div>`).join('')}</div>`;
  }
  function hotelCard(h,position){
    return `<article class="hotel"><div class="photo" style="background-image:url('${h.photo}'),${h.bg},${h.bg};background-color:#b5b7bb"><div class="photo-placeholder" aria-hidden="true">🏨</div><span class="photo-tag">${esc(h.tag)}</span><span class="photo-index">후보 ${position}</span></div>
      <div class="hotel-body"><div class="hotel-sub">${esc(h.area)}</div><div class="hotel-title"><h3>${esc(h.name)}</h3><div class="rating"><span class="star">★</span>${esc(h.rating)}<span class="rating-count">(${esc(h.review)})</span></div></div><p class="summary">${esc(h.desc)}</p>
      <div class="hotel-rows"><div class="hotel-row"><span class="row-key">📍 위치</span><span class="row-val">${esc(h.loc)}</span></div><div class="hotel-row"><span class="row-key">↺ 취소</span><span class="row-val accent">${esc(h.cancel)}</span></div><div class="hotel-row"><span class="row-key">☕ 조식</span><span class="row-val">${esc(h.breakfast)}</span></div><div class="hotel-row"><span class="row-key">▤ 객실</span><span class="row-val">${esc(h.room)}</span></div></div>
      ${renderReviews(h)}
      <div class="cost-line"><span class="cost-help">1박 / 2인 · 세금 포함</span><div class="price">${money(h.price)}<small>원~</small></div></div>
      <button class="choose" data-pick="${h.id}" type="button">이 숙소 선택 ${iconArrow}</button></div></article>`;
  }
  function renderMatch(){
    const isFinal=match===2;
    const pair=isFinal?[winners[0],winners[1]]:[seeds[match*2],seeds[match*2+1]];
    $('game').innerHTML=`<div class="match-intro"><span class="round-pill">${isFinal?'FINAL ROUND':'ROUND OF 4 · MATCH '+(match+1)}</span><h2>${isFinal?'마지막 두 곳, 최종 선택은?':'두 숙소 중 더 끌리는 곳은?'}</h2><p>${isFinal?'지금까지 고른 숙소 중 마음에 드는 한 곳을 선택해 보세요.':'두 숙소의 조건과 후기를 살펴보고 마음에 드는 곳을 선택하세요.'}</p></div><div class="match-perk">🎟️ <strong>월드컵을 완료하면?</strong> 지금 예약할 때 쓸 수 있는 시크릿 쿠폰이 열려요!</div><div class="compare-wrap">${hotelCard(pair[0],1)}<div class="vs" aria-hidden="true">VS</div>${hotelCard(pair[1],2)}</div>`;
    document.querySelectorAll('[data-pick]').forEach(el=>el.addEventListener('click',()=>pick(Number(el.dataset.pick))));
  }
  function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),1500)}
  function pick(id){
    if(match>2)return;
    const pair=match===2?[winners[0],winners[1]]:[seeds[match*2],seeds[match*2+1]];
    const chosen=pair.find(h=>h.id===id);
    if(!chosen)return;
    history.push(chosen.id);
    if(match<2){winners.push(chosen);match++;toast('선택 완료! 다음 대결로 넘어갈게요.');}
    else {winners.push(chosen);match=3;toast('나의 최종 숙소가 결정됐어요!')}
    render();
    scrollToStage();
  }
  function renderResult(){
    const h=winners[2];
    $('game').innerHTML=`<section class="result"><div class="result-head"><span class="result-trophy" aria-hidden="true">🏆</span><span class="round-pill">MY FINAL PICK</span><h2>나의 최종 숙소가 정해졌어요!</h2><p>고민 끝! 직접 비교해서 고른 나만의 숙소예요.</p></div>
      <article class="result-card"><div class="result-image" style="background-image:url('${h.photo}'),${h.bg}"><span class="result-badge">🏆 숙소 월드컵 우승</span></div><div class="result-info"><div class="hotel-sub">${esc(h.area)} · <span style="color:#ffb237">★</span> ${esc(h.rating)} (${esc(h.review)})</div><h3>${esc(h.name)}</h3><div class="description">${esc(h.desc)}</div><div class="result-attributes"><span class="attribute">📍 ${esc(h.loc)}</span><span class="attribute">↺ ${esc(h.cancel)}</span><span class="attribute">☕ ${esc(h.breakfast)}</span><span class="attribute">▤ ${esc(h.room)}</span></div>${renderReviews(h)}
      <div class="coupon-banner"><span class="coupon-icon">🎟️</span><div><strong>지금 예약하면 시크릿 쿠폰 적용!!</strong><p>월드컵 최종 선택 혜택 · 시연용 시크릿 쿠폰 10,000원 할인</p></div><span class="coupon-mini">-10,000원</span></div>
      <div class="result-footer"><div class="result-price"><s class="before-price">${money(h.price)}원</s><br>${money(h.price-couponAmount)}원<small>쿠폰 적용 시 · 1박 예시</small></div><button class="choose" id="startBooking" type="button">지금 예약하고 쿠폰 적용 ${iconArrow}</button></div></div></article>
      <div class="tipbox"><strong>월드컵 특별 혜택</strong><br>최종 선택한 숙소의 앱 내 예약 화면으로 이동하면 시크릿 쿠폰이 자동 적용돼요. 본 페이지는 실제 예약·결제가 진행되지 않는 콘셉트 시연입니다.</div><button class="result-reset" id="retry" type="button">↻ 다른 조합으로 다시 하기</button></section>`;
    $('retry').addEventListener('click',()=>reset(true));
    $('startBooking').addEventListener('click',()=>{match=4;render();scrollToStage()});
  }
  function renderBooking(){
    const h=winners[2];
    $('game').innerHTML=`<section class="result"><div class="result-head"><span class="round-pill">APP BOOKING · DEMO</span><h2>예약 정보를 확인해 주세요</h2><p>월드컵에서 고른 숙소의 시크릿 쿠폰이 자동 적용됐어요.</p></div>
      <article class="result-card"><div class="booking-hotel"><div class="booking-thumb" style="background-image:url('${h.photo}'),${h.bg}"></div><div><div class="hotel-sub">${esc(h.area)} · ★ ${esc(h.rating)}</div><h3>${esc(h.name)}</h3><p>${esc(h.room)} · 1박 기준 예시</p></div></div>
      <div class="booking-body"><div class="coupon-banner"><span class="coupon-icon">🎁</span><div><strong>시크릿 쿠폰 적용 완료!</strong><p>숙소 월드컵을 마친 고객만을 위한 시연 혜택</p></div><span class="coupon-mini">적용됨</span></div>
      <div class="booking-line"><span>숙소 금액</span><strong>${money(h.price)}원</strong></div><div class="booking-line discount"><span>시크릿 쿠폰 할인</span><strong>−${money(couponAmount)}원</strong></div><div class="booking-total"><span>최종 결제 예상 금액</span><strong>${money(h.price-couponAmount)}원</strong></div>
      <p class="demo-notice">시연용 가상 숙소·가격·쿠폰입니다. 실제 예약이나 결제는 발생하지 않습니다.</p>
      <button class="choose" id="confirmDemo" type="button">시연 예약 완료하기 ${iconArrow}</button><button class="result-reset" id="backToResult" type="button">← 선택 결과로 돌아가기</button></div></article></section>`;
    $('confirmDemo').addEventListener('click',()=>{toast('시연 예약이 완료됐어요!');$('game').innerHTML=`<section class="result"><div class="result-head"><span class="result-trophy" aria-hidden="true">🎉</span><span class="round-pill">BOOKING DEMO COMPLETE</span><h2>시연 예약이 완료됐어요!</h2><p>${esc(h.name)} · 시크릿 쿠폰 ${money(couponAmount)}원 적용<br>실제 예약이나 결제가 이루어진 것은 아닙니다.</p><button class="choose finish-retry" id="finishRetry" type="button">숙소 월드컵 다시 하기 ${iconArrow}</button></div></section>`;$('finishRetry').addEventListener('click',()=>reset(true));});
    $('backToResult').addEventListener('click',()=>{match=3;render();scrollToStage()});
  }
  function scrollToStage(){const panel=document.querySelector('.stage-panel');if(panel)panel.scrollIntoView({behavior:'smooth',block:'start'});}
  function render(){renderStage();if(match<3)renderMatch();else if(match===3)renderResult();else renderBooking()}
  function reset(shuffle=false){
    seeds=hotels.slice();
    if(shuffle){for(let i=seeds.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[seeds[i],seeds[j]]=[seeds[j],seeds[i]]}}
    winners=[];history=[];match=0;render();
    window.scrollTo({top:0,behavior:'smooth'});
  }
  $('resetTop').addEventListener('click',()=>reset());
  $('homeLink').addEventListener('click',e=>{e.preventDefault();reset()});
  render();
</script>
</body>
</html>
